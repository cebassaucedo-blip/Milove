<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0">

<title>Flores para Katty 🌻</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    background:
        radial-gradient(circle at center,
        #382600 0%,
        #160e02 45%,
        #050301 100%);

    font-family: Arial, sans-serif;
}

/* CONTENEDOR */

.contenedor {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

/* MENSAJE */

.mensaje {
    position: absolute;
    top: 12%;
    width: 100%;
    text-align: center;
    z-index: 10;
    padding: 10px;
}

.titulo {
    color: white;
    font-size: clamp(28px, 8vw, 65px);
    font-weight: bold;
    text-shadow:
        0 0 10px #ffcc33,
        0 0 25px #ff9900;

    animation: aparecer 2s ease;
}

.flores-texto {
    color: #ffd21c;
    font-size: clamp(32px, 10vw, 80px);
    font-weight: bold;

    text-shadow:
        0 0 10px #ffb300,
        0 0 30px #ffcc00;

    animation: brillo 2s infinite alternate;
}

.nombre {
    color: white;
    font-size: clamp(28px, 7vw, 55px);
    margin-top: 15px;

    text-shadow:
        0 0 15px #fff;
}

.amor {
    color: #ffd52a;
    font-size: clamp(22px, 6vw, 42px);
    font-weight: bold;

    text-shadow:
        0 0 10px #ffcc00;
}

/* FLORES */

.flor {
    position: absolute;
    animation: subir linear infinite;
}

/* PÉTALOS */

.petalo {
    position: absolute;
    width: 12px;
    height: 22px;

    background: #ffd21c;

    border-radius: 50%;

    box-shadow:
        0 0 10px #ffcc00;

    animation: caer linear infinite;
}

/* CORAZONES */

.corazon {
    position: absolute;
    color: #ff4d4d;
    font-size: 25px;

    text-shadow:
        0 0 10px #ff0000;

    animation: flotar linear infinite;
}

/* ANIMACIONES */

@keyframes aparecer {

    from {
        opacity: 0;
        transform: translateY(-40px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

@keyframes brillo {

    from {
        text-shadow:
        0 0 10px #ffcc00;
    }

    to {
        text-shadow:
        0 0 15px #fff000,
        0 0 35px #ff9900;
    }

}

@keyframes subir {

    from {
        transform:
        translateY(100px)
        rotate(0deg);
    }

    to {
        transform:
        translateY(-120vh)
        rotate(360deg);
    }

}

@keyframes caer {

    from {
        transform:
        translateY(-100px)
        rotate(0deg);
    }

    to {
        transform:
        translateY(110vh)
        rotate(360deg);
    }

}

@keyframes flotar {

    from {
        transform:
        translateY(100vh)
        scale(0.5);
        opacity: 0;
    }

    30% {
        opacity: 1;
    }

    to {
        transform:
        translateY(-100px)
        scale(1.3);
        opacity: 0;
    }

}

</style>
</head>

<body>

<div class="contenedor">

    <!-- MENSAJE -->

    <div class="mensaje">

        <div class="titulo">
            ¡Feliz día de las
        </div>

        <div class="flores-texto">
            Flores Amarillas 🌻
        </div>

        <div class="nombre">
            Katty
        </div>

        <div class="amor">
            Te amo mucho ❤️
        </div>

    </div>


    <!-- FLORES -->

    <div class="flor"
         style="left:10%; bottom:5%;
         font-size:70px;
         animation-duration:8s;">
         🌻
    </div>

    <div class="flor"
         style="left:30%; bottom:-5%;
         font-size:90px;
         animation-duration:10s;">
         🌼
    </div>

    <div class="flor"
         style="left:55%; bottom:0;
         font-size:80px;
         animation-duration:9s;">
         🌻
    </div>

    <div class="flor"
         style="left:78%; bottom:-10%;
         font-size:100px;
         animation-duration:11s;">
         🌻
    </div>

    <div class="flor"
         style="left:90%; bottom:10%;
         font-size:55px;
         animation-duration:7s;">
         🌼
    </div>


    <!-- PÉTALOS -->

    <div class="petalo"
         style="left:5%;
         animation-duration:6s;">
    </div>

    <div class="petalo"
         style="left:15%;
         animation-duration:8s;">
    </div>

    <div class="petalo"
         style="left:25%;
         animation-duration:7s;">
    </div>

    <div class="petalo"
         style="left:40%;
         animation-duration:9s;">
    </div>

    <div class="petalo"
         style="left:55%;
         animation-duration:6s;">
    </div>

    <div class="petalo"
         style="left:70%;
         animation-duration:8s;">
    </div>

    <div class="petalo"
         style="left:85%;
         animation-duration:7s;">
    </div>


    <!-- CORAZONES -->

    <div class="corazon"
         style="left:15%;
         animation-duration:7s;">
         ❤️
    </div>

    <div class="corazon"
         style="left:40%;
         animation-duration:9s;">
         💛
    </div>

    <div class="corazon"
         style="left:65%;
         animation-duration:8s;">
         ❤️
    </div>

    <div class="corazon"
         style="left:85%;
         animation-duration:10s;">
         💛
    </div>

</div>

</body>
</html>
